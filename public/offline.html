<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f4ec" />
    <title>离线 - 黎安屿你</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f7f4ec;
        color: #333;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .offline-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        opacity: 0.6;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #1fa7a0;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        color: #666;
        max-width: 300px;
        margin-bottom: 24px;
      }
      .retry-btn {
        display: inline-block;
        padding: 12px 32px;
        background: #1fa7a0;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      .retry-btn:hover {
        background: #178a84;
      }
      .retry-btn:active {
        background: #126b66;
      }
    </style>
  </head>
  <body>
    <svg
      class="offline-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"
      />
    </svg>
    <h1>网络连接已断开</h1>
    <p>请检查您的网络连接后重试。部分已缓存的内容仍可访问。</p>
    <button class="retry-btn" onclick="location.reload()">重试</button>
  </body>
</html>
