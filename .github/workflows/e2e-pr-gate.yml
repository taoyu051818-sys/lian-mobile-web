name: E2E PR Gate

# Pull requests run only deterministic loopback journeys. Production
# availability is monitored separately by e2e-journey.yml and never blocks a
# code change because a tunnel or DNS record is unavailable.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-journeys:
    name: E2E PR gate (deterministic local journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run deterministic local journeys
        run: npm run test:e2e:local -- --grep-invert @local-commerce

      - name: Run store-read commerce journey
        env:
          VITE_COMMERCE_CATALOG_VISIBLE: "true"
          VITE_COMMERCE_PRODUCT_VISIBLE: "false"
          VITE_COMMERCE_CART_VISIBLE: "false"
          VITE_COMMERCE_CHECKOUT_QUOTE_VISIBLE: "false"
        run: >-
          npm run test:e2e:local --
          tests/e2e/local/commerce-store-read-journeys.spec.ts

      - name: Run product-read commerce journey
        env:
          VITE_COMMERCE_CATALOG_VISIBLE: "true"
          VITE_COMMERCE_PRODUCT_VISIBLE: "true"
          VITE_COMMERCE_CART_VISIBLE: "false"
          VITE_COMMERCE_CHECKOUT_QUOTE_VISIBLE: "false"
        run: >-
          npm run test:e2e:local --
          tests/e2e/local/commerce-product-read-journeys.spec.ts

      - name: Run cart commerce journey
        env:
          VITE_COMMERCE_CATALOG_VISIBLE: "true"
          VITE_COMMERCE_PRODUCT_VISIBLE: "true"
          VITE_COMMERCE_CART_VISIBLE: "true"
          VITE_COMMERCE_CHECKOUT_QUOTE_VISIBLE: "false"
        run: >-
          npm run test:e2e:local --
          tests/e2e/local/commerce-cart-journeys.spec.ts

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-journey-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
