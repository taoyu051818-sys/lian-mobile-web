name: E2E PR Gate

# Pull requests run only deterministic loopback journeys. Production
# availability is monitored separately by e2e-journey.yml and never blocks a
# code change because a tunnel or DNS record is unavailable.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-journeys:
    name: E2E PR gate (deterministic local journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run deterministic local journeys
        run: npm run test:e2e:local

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local-journey-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
