name: Auto ownership doc

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-ownership-doc-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh generated ownership doc
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh ownership doc
        run: npm run ownership-doc

      - name: Verify generator determinism
        run: npm run check:ownership-doc

      - name: Commit refreshed ownership doc
        run: |
          if git diff --quiet -- docs/architecture/auto/file-ownership.md; then
            echo "ownership doc already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/auto/file-ownership.md
          git commit -m "chore: refresh ownership doc"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
