name: Frontend Release Build

on:
  workflow_dispatch:
    inputs:
      backend_commit:
        description: Exact reviewed lian-platform-server commit currently intended for this release
        required: true
        type: string

concurrency:
  group: frontend-auto-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend (static guards + build + smoke)
        run: npm run verify

      - name: Stamp unified release manifest
        env:
          LIAN_BACKEND_COMMIT: ${{ inputs.backend_commit }}
          LIAN_FRONTEND_COMMIT: ${{ github.sha }}
          LIAN_RELEASE_ENVIRONMENT: production
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          LIAN_RELEASE_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export LIAN_RELEASE_BUILT_AT
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "built_at=${LIAN_RELEASE_BUILT_AT}"
          } > dist/build-commit.txt
          npm run release:manifest
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync("dist/release-manifest.json", "utf8"));
            if (value.components.frontend.commit !== process.env.LIAN_FRONTEND_COMMIT
                || value.components.backend.commit !== process.env.LIAN_BACKEND_COMMIT) process.exit(1);
          '

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  deploy-main:
    name: deploy main frontend
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: frontend-production
    steps:
      - name: Check deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.LIAN_WEB_SSH_HOST }}" ]; then echo "Missing secret: LIAN_WEB_SSH_HOST"; missing=1; fi
          if [ -z "${{ secrets.LIAN_WEB_SSH_USER }}" ]; then echo "Missing secret: LIAN_WEB_SSH_USER"; missing=1; fi
          if [ -z "${{ secrets.LIAN_WEB_SSH_KEY }}" ]; then echo "Missing secret: LIAN_WEB_SSH_KEY"; missing=1; fi
          exit "$missing"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.LIAN_WEB_SSH_KEY }}" > ~/.ssh/lian_web_deploy_key
          chmod 600 ~/.ssh/lian_web_deploy_key
          ssh-keyscan -H "${{ secrets.LIAN_WEB_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Download reviewed frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: release-dist

      - name: Verify reviewed artifact marker
        env:
          EXPECTED_BACKEND_COMMIT: ${{ inputs.backend_commit }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          case "$EXPECTED_BACKEND_COMMIT" in
            (????????????????????????????????????????|????????????????????????????????????????????????????????????????) ;;
            (*) echo "backend_commit must be an exact Git object id"; exit 1 ;;
          esac
          case "$EXPECTED_BACKEND_COMMIT" in (*[!0-9a-f]*) exit 1 ;; esac
          test -f release-dist/build-commit.txt
          test -f release-dist/release-manifest.json
          grep -qx "commit=$EXPECTED_COMMIT" release-dist/build-commit.txt
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync("release-dist/release-manifest.json", "utf8"));
            if (value.schemaVersion !== 1
                || value.components.frontend.commit !== process.env.EXPECTED_COMMIT
                || value.components.backend.commit !== process.env.EXPECTED_BACKEND_COMMIT) process.exit(1);
          '
          cat release-dist/build-commit.txt

      - name: Verify running backend revision
        env:
          EXPECTED_BACKEND_COMMIT: ${{ inputs.backend_commit }}
          LIAN_BACKEND_HEALTH_URL: ${{ vars.LIAN_BACKEND_HEALTH_URL || 'https://lian.nat100.top/api/system/health' }}
        run: |
          set -Eeuo pipefail
          case "$LIAN_BACKEND_HEALTH_URL" in (https://*) ;; (*) exit 1 ;; esac
          curl --fail --silent --show-error --max-time 15 \
            "$LIAN_BACKEND_HEALTH_URL" > backend-health.json
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync("backend-health.json", "utf8"));
            if (value.revision !== process.env.EXPECTED_BACKEND_COMMIT) {
              console.error("Running backend revision does not match the reviewed release manifest");
              process.exit(1);
            }
          '

      - name: Upload reviewed frontend artifact
        env:
          EXPECTED_BACKEND_COMMIT: ${{ inputs.backend_commit }}
          LIAN_WEB_DIR: ${{ vars.LIAN_WEB_DIR || '/opt/lian-mobile-web' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if ! printf '%s' "$LIAN_WEB_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "LIAN_WEB_DIR must be an absolute path with only A-Z a-z 0-9 . _ - / characters"
            exit 1
          fi
          if printf '%s' "$LIAN_WEB_DIR" | grep -Eq '(^|/)\.\.?(/|$)|//'; then
            echo "LIAN_WEB_DIR must not contain dot segments or repeated slashes"
            exit 1
          fi
          if [ "$LIAN_WEB_DIR" = "/" ] || printf '%s' "$LIAN_WEB_DIR" | grep -Eq '/$'; then
            echo "LIAN_WEB_DIR must not be root or end with a slash"
            exit 1
          fi
          tar -C release-dist -czf frontend-dist.tgz .
          scp -i ~/.ssh/lian_web_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            frontend-dist.tgz \
            "${{ secrets.LIAN_WEB_SSH_USER }}@${{ secrets.LIAN_WEB_SSH_HOST }}:/tmp/lian-frontend-${EXPECTED_COMMIT}.tgz"

          ssh -i ~/.ssh/lian_web_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LIAN_WEB_SSH_USER }}@${{ secrets.LIAN_WEB_SSH_HOST }}" \
            "LIAN_WEB_DIR='${LIAN_WEB_DIR}' EXPECTED_COMMIT='${EXPECTED_COMMIT}' EXPECTED_BACKEND_COMMIT='${EXPECTED_BACKEND_COMMIT}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          archive="/tmp/lian-frontend-${EXPECTED_COMMIT}.tgz"
          cd "$LIAN_WEB_DIR"

          release_dir="$(mktemp -d "$LIAN_WEB_DIR/.release-dist.XXXXXX")"
          cleanup_release_dir=1
          restore_previous_dist=0
          cleanup() {
            if [ "${cleanup_release_dir:-0}" = "1" ] && [ -n "${release_dir:-}" ]; then
              rm -rf "$release_dir"
            fi
            if [ "${restore_previous_dist:-0}" = "1" ] && [ -n "${previous_dir:-}" ] && [ -d "$previous_dir" ] && [ ! -e dist ]; then
              mv "$previous_dir" dist
            fi
            rm -f "$archive"
          }
          trap cleanup EXIT

          tar -xzf "$archive" -C "$release_dir"
          test -f "$release_dir/build-commit.txt"
          test -f "$release_dir/release-manifest.json"
          grep -qx "commit=$EXPECTED_COMMIT" "$release_dir/build-commit.txt"
          grep -Fq "\"commit\": \"$EXPECTED_COMMIT\"" "$release_dir/release-manifest.json"
          grep -Fq "\"commit\": \"$EXPECTED_BACKEND_COMMIT\"" "$release_dir/release-manifest.json"

          previous_dir=""
          if [ -d dist ]; then
            previous_dir="dist.previous.$(date -u +%Y%m%dT%H%M%SZ)"
            mv dist "$previous_dir"
            restore_previous_dist=1
          fi

          mv "$release_dir" dist
          cleanup_release_dir=0
          restore_previous_dist=0

          echo "Frontend artifact deployed at $EXPECTED_COMMIT"
          if [ -n "$previous_dir" ]; then
            echo "Previous dist moved to $previous_dir"
          fi
          REMOTE

      - name: Verify remote build marker
        env:
          EXPECTED_BACKEND_COMMIT: ${{ inputs.backend_commit }}
          LIAN_WEB_DIR: ${{ vars.LIAN_WEB_DIR || '/opt/lian-mobile-web' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if ! printf '%s' "$LIAN_WEB_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "LIAN_WEB_DIR must be an absolute path with only A-Z a-z 0-9 . _ - / characters"
            exit 1
          fi
          if printf '%s' "$LIAN_WEB_DIR" | grep -Eq '(^|/)\.\.?(/|$)|//'; then
            echo "LIAN_WEB_DIR must not contain dot segments or repeated slashes"
            exit 1
          fi
          if [ "$LIAN_WEB_DIR" = "/" ] || printf '%s' "$LIAN_WEB_DIR" | grep -Eq '/$'; then
            echo "LIAN_WEB_DIR must not be root or end with a slash"
            exit 1
          fi
          ssh -i ~/.ssh/lian_web_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LIAN_WEB_SSH_USER }}@${{ secrets.LIAN_WEB_SSH_HOST }}" \
            "LIAN_WEB_DIR='${LIAN_WEB_DIR}' EXPECTED_COMMIT='${EXPECTED_COMMIT}' EXPECTED_BACKEND_COMMIT='${EXPECTED_BACKEND_COMMIT}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$LIAN_WEB_DIR"
          test -f dist/build-commit.txt
          test -f dist/release-manifest.json
          grep -qx "commit=$EXPECTED_COMMIT" dist/build-commit.txt
          grep -Fq "\"commit\": \"$EXPECTED_COMMIT\"" dist/release-manifest.json
          grep -Fq "\"commit\": \"$EXPECTED_BACKEND_COMMIT\"" dist/release-manifest.json
          cat dist/build-commit.txt
          REMOTE

      - name: Verify public unified release identity
        env:
          EXPECTED_BACKEND_COMMIT: ${{ inputs.backend_commit }}
          EXPECTED_COMMIT: ${{ github.sha }}
          LIAN_BACKEND_HEALTH_URL: ${{ vars.LIAN_BACKEND_HEALTH_URL || 'https://lian.nat100.top/api/system/health' }}
          LIAN_WEB_PUBLIC_URL: ${{ vars.LIAN_WEB_PUBLIC_URL || 'https://lian.nat100.top' }}
        run: |
          set -Eeuo pipefail
          case "$LIAN_WEB_PUBLIC_URL" in (https://*) ;; (*) exit 1 ;; esac
          curl --fail --silent --show-error --max-time 15 \
            "${LIAN_WEB_PUBLIC_URL%/}/release-manifest.json" > public-release-manifest.json
          curl --fail --silent --show-error --max-time 15 \
            "$LIAN_BACKEND_HEALTH_URL" > public-backend-health.json
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("public-release-manifest.json", "utf8"));
            const health = JSON.parse(fs.readFileSync("public-backend-health.json", "utf8"));
            if (manifest.schemaVersion !== 1
                || manifest.components.frontend.commit !== process.env.EXPECTED_COMMIT
                || manifest.components.backend.commit !== process.env.EXPECTED_BACKEND_COMMIT
                || health.revision !== process.env.EXPECTED_BACKEND_COMMIT) process.exit(1);
          '
