name: Frontend Release Build

on:
  workflow_dispatch:

concurrency:
  group: frontend-auto-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend (static guards + build + smoke)
        run: npm run verify

      - name: Stamp build commit
        run: |
          mkdir -p dist
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/build-commit.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  deploy-main:
    name: deploy main frontend
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: frontend-production
    steps:
      - name: Check deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.LIAN_WEB_SSH_HOST }}" ]; then echo "Missing secret: LIAN_WEB_SSH_HOST"; missing=1; fi
          if [ -z "${{ secrets.LIAN_WEB_SSH_USER }}" ]; then echo "Missing secret: LIAN_WEB_SSH_USER"; missing=1; fi
          if [ -z "${{ secrets.LIAN_WEB_SSH_KEY }}" ]; then echo "Missing secret: LIAN_WEB_SSH_KEY"; missing=1; fi
          exit "$missing"

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.LIAN_WEB_SSH_KEY }}" > ~/.ssh/lian_web_deploy_key
          chmod 600 ~/.ssh/lian_web_deploy_key
          ssh-keyscan -H "${{ secrets.LIAN_WEB_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Download reviewed frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: release-dist

      - name: Verify reviewed artifact marker
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test -f release-dist/build-commit.txt
          grep -qx "commit=$EXPECTED_COMMIT" release-dist/build-commit.txt
          cat release-dist/build-commit.txt

      - name: Upload reviewed frontend artifact
        env:
          LIAN_WEB_DIR: ${{ vars.LIAN_WEB_DIR || '/opt/lian-mobile-web' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          tar -C release-dist -czf frontend-dist.tgz .
          scp -i ~/.ssh/lian_web_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            frontend-dist.tgz \
            "${{ secrets.LIAN_WEB_SSH_USER }}@${{ secrets.LIAN_WEB_SSH_HOST }}:/tmp/lian-frontend-${EXPECTED_COMMIT}.tgz"

          ssh -i ~/.ssh/lian_web_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LIAN_WEB_SSH_USER }}@${{ secrets.LIAN_WEB_SSH_HOST }}" \
            "LIAN_WEB_DIR='${LIAN_WEB_DIR}' EXPECTED_COMMIT='${EXPECTED_COMMIT}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          archive="/tmp/lian-frontend-${EXPECTED_COMMIT}.tgz"
          cd "$LIAN_WEB_DIR"

          release_dir="$(mktemp -d "$LIAN_WEB_DIR/.release-dist.XXXXXX")"
          cleanup_release_dir=1
          cleanup() {
            if [ "${cleanup_release_dir:-0}" = "1" ] && [ -n "${release_dir:-}" ]; then
              rm -rf "$release_dir"
            fi
            rm -f "$archive"
          }
          trap cleanup EXIT

          tar -xzf "$archive" -C "$release_dir"
          test -f "$release_dir/build-commit.txt"
          grep -qx "commit=$EXPECTED_COMMIT" "$release_dir/build-commit.txt"

          previous_dir=""
          if [ -d dist ]; then
            previous_dir="dist.previous.$(date -u +%Y%m%dT%H%M%SZ)"
            mv dist "$previous_dir"
          fi

          mv "$release_dir" dist
          cleanup_release_dir=0

          echo "Frontend artifact deployed at $EXPECTED_COMMIT"
          if [ -n "$previous_dir" ]; then
            echo "Previous dist moved to $previous_dir"
          fi
          REMOTE

      - name: Verify remote build marker
        env:
          LIAN_WEB_DIR: ${{ vars.LIAN_WEB_DIR || '/opt/lian-mobile-web' }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/lian_web_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.LIAN_WEB_SSH_USER }}@${{ secrets.LIAN_WEB_SSH_HOST }}" \
            "LIAN_WEB_DIR='${LIAN_WEB_DIR}' EXPECTED_COMMIT='${EXPECTED_COMMIT}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$LIAN_WEB_DIR"
          test -f dist/build-commit.txt
          grep -qx "commit=$EXPECTED_COMMIT" dist/build-commit.txt
          cat dist/build-commit.txt
          REMOTE
