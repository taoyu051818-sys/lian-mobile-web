name: E2E Journey

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

jobs:
  nat100-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_BASE_URL: https://lian.nat100.top
      LIAN_E2E_USERNAME: ${{ secrets.LIAN_E2E_USERNAME }}
      LIAN_E2E_PASSWORD: ${{ secrets.LIAN_E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run journey test
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-journey-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
