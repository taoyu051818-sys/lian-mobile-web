name: Production Canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-canary:
    name: Production canary (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_BASE_URL: ${{ vars.LIAN_PRODUCTION_BASE_URL || 'https://lian.nat100.top' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run read-only production canary
        run: npx playwright test tests/e2e/production-canary.spec.ts --retries=0 --reporter=list

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-canary-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
